spring:
  application:
    name: spotify-sort
  datasource:
    url: jdbc:postgresql://localhost:5432/spotifysort
    username: spotifysort
    password: spotifysort
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

spotify:
  client-id: ${SPOTIFY_CLIENT_ID:your-client-id}
  client-secret: ${SPOTIFY_CLIENT_SECRET:your-client-secret}
  redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/auth/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

server:
  port: 8080